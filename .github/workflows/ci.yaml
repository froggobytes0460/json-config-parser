name: CI Pull Request Check
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: dependencies
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake Dependencies
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Clang-Tidy Review
        uses: ZedThree/clang-tidy-review@v0.23.1
        id: review
        with:
          build_dir: build
          config_file: .clang-tidy

      - name: Compile Targets
        run: cmake --build build --config Release

      - name: Execute Automated Tests
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test_results.xml
        continue-on-error: true

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Catch2 Unit Tests
          path: build/test_results.xml
          reporter: java-junit
          fail-on-error: 'true'
...
